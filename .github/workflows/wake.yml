name: Wake Up Streamlit App

on:
  schedule:
    # Runs every 1 hours (adjust the cron expression if you prefer a different frequency)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to keep app alive
        run: |
          curl -I https://ai-risk-issue-dashboard.streamlit.app/
